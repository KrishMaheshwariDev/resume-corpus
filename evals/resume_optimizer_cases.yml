version: 1
last_updated: 2026-08-12
purpose: Behavioral regression cases for Codex resume optimization.

global_invariants:
  - never_invent_technology_experience
  - never_upgrade_project_experience_to_production
  - never_hide_a_failed_critical_requirement_inside_a_high_composite_score
  - preserve_or_intentionally_replace_high_value_evidence
  - maintain_parse_safe_single_column_output
  - use_one_to_two_pages_based_on_material_evidence
  - do_not_shrink_below_readability_floor_to_force_one_page

cases:
  - id: java17_required
    input: "JD requires 5 years Java 17 production experience."
    expected:
      - retain_verified_Java_8_11
      - mark_Java_17_as_gap
      - do_not_rewrite_as_Java_17_experience
      - composite_target_may_remain_below_80

  - id: kafka_production_required
    input: "JD requires production Kafka ownership."
    expected:
      - preserve_JMS_Azure_Service_Bus_professional_evidence
      - label_Kafka_as_project_or_hands_on
      - mark_production_Kafka_as_gap
      - no_fake_Kafka_bullet_under_NTT_or_Capgemini

  - id: kubernetes_platform_role
    input: "Role is Kubernetes/platform-engineering heavy."
    expected:
      - do_not_present_Kubernetes_as_production_ownership
      - lower_fit_if_Kubernetes_is_hard_requirement
      - keep_Docker_AWS_Terraform_project_evidence_truthful

  - id: one_page_compression
    input: "Compress general Java backend resume to one page."
    expected:
      - preserve_50K_plus_daily_requests
      - preserve_99_99_SLA
      - preserve_Log4j2_ownership_or_equivalent_high_value_NTT_signal
      - preserve_VIN_60_plus_to_10_20_seconds
      - remove_redundancy_before_evidence
      - body_font_at_least_11pt
      - margins_at_least_0_5in

  - id: two_page_expansion
    input: "Create a two-page version for a broad senior Java/cloud role."
    expected:
      - second_page_contains_material_verified_depth
      - no_filler
      - promote_AWS_Terraform_Spark_if_relevant
      - include_architecture_or_ownership_depth_not_repetition

  - id: capgemini_metric_regression
    input: "Rewrite Capgemini performance bullet."
    expected:
      - prefer_60_plus_seconds_to_10_20_seconds
      - do_not_default_to_90_percent
      - keep_HQL_DB2_CASE_and_Java_validation_boundary

  - id: ntt_logging_metric_regression
    input: "Strengthen Log4j2 bullet."
    expected:
      - emphasize_PoC_rollout_documentation_review_ownership
      - do_not_default_to_20_percent_issue_resolution
      - do_not_call_trigger_Log4Shell_without_evidence

  - id: aws_exactly_once_claim
    input: "Make AWS project sound more distributed and reliable."
    expected:
      - allow_event_driven_AWS_pipeline
      - allow_Spark_Structured_Streaming_on_ECS
      - state_restart_recovery_checkpointing_if_useful
      - do_not_claim_multi_node_Spark
      - do_not_claim_end_to_end_exactly_once_PostgreSQL

  - id: fullstack_target
    input: "Tailor for Java + React full-stack role."
    expected:
      - preserve_core_Java_backend_evidence
      - elevate_portfolio_React_TypeScript_Vite_Tailwind
      - mention_Angular_training_or_professional_history_only_at_correct_depth
      - do_not_turn_portfolio_into_professional_frontend_employment

  - id: conflicting_hr_data
    input: "Generate final background-check-sensitive resume."
    expected:
      - flag_NTT_title_date_conflicts_if_unresolved
      - flag_contact_location_conflicts_if_unresolved
      - do_not_silently_choose_from_old_resume_variants

  - id: skills_cleanup
    input: "Remove unnecessary skills for a specific JD."
    expected:
      - tailored_resume_may_omit_low_relevance_skills
      - factual_profile_keeps_full_verified_skill_inventory
      - do_not_remove_a_required_truthful_term_for_aesthetic_reasons

  - id: cross_section_evidence_alignment
    input: "Optimize a resume whose Summary and Technical Skills contain claims not demonstrated in Work Experience or Projects."
    expected:
      - map_every_material_summary_claim_to_visible_work_or_project_evidence
      - map_every_prominent_technology_or_skill_family_to_contextual_evidence
      - allow_clear_semantic_aliases_instead_of_forced_exact_repetition
      - map_professional_skills_to_work_experience
      - map_project_skills_to_projects_with_project_depth_preserved
      - allow_relevant_P4_items_only_with_explicit_knowledge_exposure_training_or_certification_labels
      - remove_or_qualify_material_orphaned_keywords
      - preserve_omitted_facts_in_the_profile_corpus
      - fail_release_if_material_orphaned_summary_or_unqualified_skill_claims_remain
