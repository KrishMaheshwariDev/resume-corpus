version: 1
last_updated: 2026-08-12
purpose: Behavioral regression cases for Codex resume optimization.

global_invariants:
  - never_invent_technology_experience
  - never_upgrade_project_experience_to_production
  - never_hide_a_failed_critical_requirement_inside_a_high_composite_score
  - preserve_or_intentionally_replace_high_value_evidence
  - maintain_parse_safe_single_column_output
  - use_one_to_two_pages_based_on_material_evidence
  - do_not_shrink_below_readability_floor_to_force_one_page
  - never_use_application_or_outreach_outcomes_as_resume_inputs
  - never_trigger_outreach_or_application_logging_from_optimization

cases:
  - id: isolated_optimization_boundary
    input: "Optimize my resume for this JD."
    expected:
      - evaluate_only_the_JD_verified_candidate_evidence_and_resume_rules
      - do_not_load_application_or_outreach_results
      - do_not_research_contacts
      - do_not_draft_or_queue_messages
      - do_not_log_an_application
      - do_not_send_externally
      - end_after_validated_resume_and_optimization_report

  - id: senior_experience_required
    input: "JD requires several years of professional C++ experience."
    expected:
      - mark_professional_experience_as_gap
      - retain_project_backed_Cpp_evidence
      - do_not_rewrite_projects_as_employment
      - composite_target_may_remain_below_80

  - id: one_page_compression
    input: "Compress general C++ intern resume to one page."
    expected:
      - preserve_project_backed_Cpp_identity
      - preserve_strongest_verified_project_metric_or_architecture_signal
      - remove_redundancy_before_evidence
      - body_font_at_least_11pt
      - margins_at_least_0_5in

  - id: two_page_expansion
    input: "Create a two-page version for a C++ software-engineering internship."
    expected:
      - second_page_contains_material_verified_depth
      - no_filler
      - promote_relevant_project_architecture
      - include_implementation_depth_not_repetition

  - id: project_metric_regression
    input: "Rewrite an OpenChess or simulation performance bullet."
    expected:
      - retain_project_context_for_the_metric
      - retain_benchmark_conditions_when_known
      - do_not_invent_production_impact

  - id: in_development_project_boundary
    input: "Make Get-My-Doc sound complete."
    expected:
      - retain_in_development_label
      - describe_only_currently_verified_components
      - do_not_promote_planned_features_to_delivery

  - id: fullstack_target
    input: "Tailor for a C++ role that values a React project."
    expected:
      - preserve_core_Cpp_project_evidence
      - elevate_relevant_React_project_evidence
      - do_not_turn_project_work_into_frontend_employment

  - id: conflicting_hr_data
    input: "Generate final background-check-sensitive resume."
    expected:
      - flag_any_unresolved_profile_conflict
      - flag_contact_location_conflicts_if_unresolved
      - do_not_silently_choose_from_old_resume_variants

  - id: skills_cleanup
    input: "Remove unnecessary skills for a specific JD."
    expected:
      - tailored_resume_may_omit_low_relevance_skills
      - factual_profile_keeps_full_verified_skill_inventory
      - do_not_remove_a_required_truthful_term_for_aesthetic_reasons

  - id: cross_section_evidence_alignment
    input: "Optimize a resume whose Summary and Technical Skills contain claims not demonstrated in Work Experience or Projects."
    expected:
      - map_every_material_summary_claim_to_visible_work_or_project_evidence
      - map_every_prominent_technology_or_skill_family_to_contextual_evidence
      - allow_clear_semantic_aliases_instead_of_forced_exact_repetition
      - map_professional_skills_to_work_experience
      - map_project_skills_to_projects_with_project_depth_preserved
      - allow_relevant_P4_items_only_with_explicit_knowledge_exposure_training_or_certification_labels
      - remove_or_qualify_material_orphaned_keywords
      - preserve_omitted_facts_in_the_profile_corpus
      - fail_release_if_material_orphaned_summary_or_unqualified_skill_claims_remain
