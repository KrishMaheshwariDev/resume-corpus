    - WebSphere
    - WebLogic
    - Jenkins
    - Maven
    - JUnit
    - Git
    - SVN
    - Azure Service Bus
    - Azure Relay
    - Azure Functions
    - JMS
    - production support

  project_strong:
    - AWS
    - Terraform
    - Docker
    - Spark
    - PySpark
    - Spark Structured Streaming
    - PostgreSQL
    - React
    - TypeScript
    - Vite
    - Tailwind CSS
    - FastAPI

  limited_or_qualify:
    Kafka: project_or_hands_on
    Kubernetes: knowledge_or_project_exposure
    FHIR: proof_of_concept_exposure
    Spring_Security: knowledge_or_project_context_unless_specific_professional_evidence_is_loaded
    OAuth2_JWT: knowledge_or_project_context_unless_specific_professional_evidence_is_loaded

resume_content_priority:
  preserve_first:
    - 50K_plus_daily_requests
    - 99_99_percent_SLA
    - NTT_java_soap_rest_websphere_evidence
    - Log4j2_migration_ownership
    - Capgemini_VIN_latency_direct_timing
    - Python_prediction_plus_java_validation
    - core_Java_Spring_SQL_API_terms

  preserve_when_relevant:
    - AWS_Terraform_Spark_project
    - monitoring_correlation_ID_story
    - CI_CD_release_validation
    - mentoring
    - React_TypeScript_portfolio

  compress_or_remove_first:
    - generic_soft_skill_statements
    - duplicated_skill_mentions
    - low_relevance_training
    - uncontextualized_tool_lists
    - unsupported_marketing_percentages
    - low_relevance_project_detail

summary_policy:
  structure:
    - role_identity
    - experience_depth
    - enterprise_domain_and_system_type
    - one_or_two_high_value_proof_points
    - supporting_modern_breadth_if_space
  avoid:
    - generic_self_praise
    - adjective_stacking
    - list_of_every_tool
    - unsupported_metrics
