  professional_production:
    - Java 8/11
    - Spring Framework
    - Spring Boot
    - JAX-WS
    - REST/SOAP
    - J2EE/Java EE
    - EJB
    - JSF
    - Hibernate/HQL
    - JDBC/OJDBC
    - Oracle
