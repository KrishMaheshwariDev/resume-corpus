  capgemini_mercedes_vans:
    confidence: high
    client: Mercedes / Daimler Vans
    domain: dealer vehicle configuration / recommendation / ordering
    architecture:
      application_style: Java EE/J2EE monolith
      packaging: EAR
      app_server: Oracle WebLogic
      database: IBM DB2
      ui: JSF with AJAX
      persistence:
        - Hibernate
        - HQL
      logical_layers:
        - JSF/UI
        - service
        - DAO
        - DTO
      spring_boot_production_mapping: not established for Mercedes production application
    prediction_integration:
      service_language: Python
      model_type_rule: safest wording is Python prediction service; current recollection says hierarchical while older resume says decision tree
      flow:
        - dealer selects/locks model and options
        - Java creates run ID
        - Java sends HTTP request and receives acknowledgement
        - Python asynchronously generates configurations and writes them to DB
        - Python calls Java callback with run ID
        - legacy callback uses HTTP GET with runId and triggers validation processing
        - Java applies deterministic mandatory/expired/package/incompatibility rules
        - configurations individually accepted/rejected
        - valid configurations displayed by relevance
      user_scope: integration/debugging and Java business validation; not model training/deployment ownership
    vin_repeat_configuration:
      confidence: high
      ownership: strong_personal_feature
      input: VIN through supplier/API workflow
      function:
        - retrieve historical configuration
        - map old/expired option codes to current equivalents
        - validate current configuration availability
      before_latency: approximately 60+ seconds
      hard_timeout: approximately 120 seconds
      optimization:
        - moved stable deterministic mapping from Java to HQL/DB2 CASE expressions
        - consolidated multi-VIN processing into database-side set processing
        - retained core business rules in Java
      after_latency: approximately 10-20 seconds
      reconstructed_reduction_for_60s_baseline: approximately 67-83%
      validation:
        - Postman locally
        - production logs
      production_rollout_support: true
      old_90_percent_metric:
        status: not_fully_substantiated_for_this_feature
        rule: do not automatically attach 90% to VIN optimization
    scheduled_validation:
      scheduler: WebLogic
      purpose: nightly checks for active configurations containing expired options
      exact_remediation_action: unknown
    debugging_pattern:
      - Python logs for generated configuration
      - Java logs for validation/invalidation
      - DB2 state/reference data
      - expired/bad option diagnosis
      metric_90_percent_data_related_bugs: conversational_approximation_not_formal_metric
    mentoring:
      confidence: high
      activities:
        - onboard junior developers
        - assign contained bugs/small production changes
        - explain codebase/business flow
        - unblock debugging
        - review code
        - test/deploy when appropriate
      quantified_mentee_count: unknown

