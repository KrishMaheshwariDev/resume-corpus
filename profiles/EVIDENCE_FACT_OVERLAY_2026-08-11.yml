purpose: Machine-readable high-priority overlay from detailed interview-prep user confirmations and current GitHub project evidence.
precedence_rule: >
  Apply this overlay after PROFILE_FACT_MATRIX_V2.yml. On conflicts involving ownership,
  architecture, skill depth, implementation detail, or metric confidence, prefer this overlay.
  Do not use this overlay to silently resolve HR title/date/contact conflicts unless marked resolved.

