projects:
  aws_spark_pipeline:
    repository: preferablehuman/AWS-automated-spark-pipeline
    architecture:
      - S3 ObjectCreated -> Lambda
      - Lambda stages .part then renames to .csv on EFS
      - Spark Structured Streaming watches EFS
      - foreachBatch writes append-mode JDBC to PostgreSQL/RDS
      - EFS stores checkpoints
      - Terraform provisions AWS infrastructure
    spark_runtime:
      current_code_master: local
      rule: do not claim current multi-node distributed Spark cluster
    exactly_once:
      checkpoint_recovery: supported
      end_to_end_jdbc_exactly_once: not established
      rule: do not claim guaranteed exactly-once PostgreSQL writes without idempotent sink strategy
    runtime_40_percent_metric:
      confidence: source_dependent
      issue: repository does not establish comparison baseline
  portfolio:
    confirmed:
      - React/TypeScript/Vite/Tailwind SPA
      - recruiter-facing evidence architecture
      - GitHub Pages deployment
      - SPA 404 fallback for deep links
    maintainability_note: large App.tsx; do not present current structure as ideal modular architecture

