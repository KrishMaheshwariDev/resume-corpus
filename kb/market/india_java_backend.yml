version: 1
researched_at: 2026-08-12
market: India
role_family: Java / Backend Software Engineering
target_experience_band: 3_to_7_years
purpose: >
  Qualitative current-market baseline for general resume optimization.
  This is not a claim about exact market-wide frequencies and does not override
  candidate evidence.

research_scope:
  company_types:
    - product_companies
    - GCCs
    - enterprise_technology
    - consulting_services
    - startups
  role_examples:
    - Java Backend Engineer
    - Backend Software Engineer
    - Java Developer
    - Software Engineer II
    - Senior Java Developer
    - Java Microservices Developer
  frequency_labeling: qualitative
  limitation: >
    Patterns are based on a current sample and recruiter-market research, not a
    complete statistical census. Refresh with the market-benchmark skill when stale.

critical_durable_clusters:
  java:
    importance: very_high
    terms:
      - Java
      - Java 8
      - Java 11
      - Java 17
    candidate_note: "Verified production evidence is Java 8/11; do not imply Java 17 production use."

  spring_backend:
    importance: very_high
    terms:
      - Spring Boot
      - Spring Framework
      - Spring MVC
      - dependency injection

  APIs_services:
    importance: very_high
    terms:
      - REST API
      - microservices
      - service integration
      - HTTP
    candidate_extension:
      - SOAP
      - JAX-WS
      - SOA

  relational_data:
    importance: very_high
    terms:
      - SQL
      - relational database
      - JDBC
      - JPA
      - Hibernate
      - query optimization

  engineering_quality:
    importance: high
    terms:
      - unit testing
      - JUnit
      - debugging
      - code review
      - production support
      - performance

common_clusters:
  build_release:
    terms:
      - Git
      - Maven
      - CI/CD
      - Jenkins
      - deployment
      - release validation

  cloud:
    terms:
      - AWS
      - Azure
      - cloud services

  containers:
    terms:
      - Docker
      - Kubernetes
    candidate_note: "Docker has strong project evidence; Kubernetes must remain knowledge/project exposure unless stronger evidence is loaded."

  persistence_patterns:
    terms:
      - Spring Data JPA
      - Hibernate
      - transactions
      - ORM

role_dependent_differentiators:
  event_driven:
    terms:
      - Kafka
      - JMS
      - queues
      - topics
      - event-driven architecture
    candidate_note: "Strong professional JMS/Azure Service Bus evidence; Kafka is not production ownership."

  security:
    terms:
      - Spring Security
      - OAuth 2.0
      - JWT
      - API security
    candidate_note: "Do not convert API Gateway boundary into authentication ownership."

  observability:
    terms:
      - logging
      - monitoring
      - metrics
      - tracing
      - root-cause analysis
    candidate_strength: strong

  system_design:
    terms:
      - scalability
      - reliability
      - distributed systems
      - resilience
      - failure handling
    candidate_note: "Use concrete enterprise integration/reliability evidence rather than generic architecture buzzwords."

candidate_market_mapping:
  strong_professional:
    - Java 8/11
    - Spring Framework / Spring Boot
    - REST / SOAP / JAX-WS
    - SQL / JDBC
    - Hibernate/HQL
    - Oracle / DB2
    - enterprise integration
    - JMS
    - Azure Service Bus / Relay / Functions
    - Jenkins / Maven / CI/CD
    - JUnit
    - production support
    - debugging / root-cause analysis
    - performance optimization
    - WebSphere / WebLogic

  strong_project:
    - AWS
    - Terraform
    - Docker
    - Spark / PySpark / Structured Streaming
    - PostgreSQL
    - React / TypeScript

  partial_or_qualified:
    - Kafka
    - Kubernetes
    - FHIR
    - Spring Security
    - OAuth 2.0
    - JWT

  genuine_current_gaps_or_non_core:
    - Java 17 production experience
    - production Kubernetes platform ownership
    - production Kafka specialist ownership
    - deep NoSQL production evidence

general_resume_priority:
  top:
    - Java
    - Spring Boot / Spring Framework
    - REST / SOAP
    - SQL / persistence
    - microservices / SOA / integration
    - production scale / reliability
    - performance / troubleshooting
  next:
    - Azure / messaging
    - CI/CD / testing
    - AWS project
    - observability
  conditional:
    - React / TypeScript
    - Kafka
    - Kubernetes
    - FHIR
    - AI/data projects

refresh_policy:
  recommended_max_age_days: 60
  refresh_when:
    - user_requests_current_market_research
    - target_role_family_changes
    - target_country_changes
    - benchmark_older_than_recommended_age
