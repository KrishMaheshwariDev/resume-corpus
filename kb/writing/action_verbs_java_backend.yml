version: 1
last_updated: 2026-07-05
purpose: Action verb taxonomy for Java backend, cloud integration, database, DevOps, and enterprise resume bullets.

usage_rules:
  - Start bullets with strong verbs when possible.
  - Match verb strength to truthful ownership.
  - Avoid repeating the same verb across consecutive bullets.
  - Prefer technical execution verbs over soft generic verbs.
  - Avoid inflated verbs unless scope is confirmed.

ownership_levels:
  direct_builder:
    description: Candidate personally implemented or materially built the work.
    verbs:
      - Developed
      - Built
      - Implemented
      - Programmed
      - Created
      - Engineered
  designer:
    description: Candidate made design or architecture decisions.
    verbs:
      - Designed
      - Modeled
      - Structured
      - Defined
      - Devised
    caution: Use only with real design responsibility.
  optimizer:
    description: Candidate improved performance, reliability, maintainability, or efficiency.
    verbs:
      - Optimized
      - Tuned
      - Refactored
      - Streamlined
      - Improved
      - Reduced
      - Accelerated
      - Standardized
  integrator:
    description: Candidate connected systems, APIs, queues, cloud components, or services.
    verbs:
      - Integrated
      - Connected
      - Orchestrated
      - Bridged
      - Synchronized
      - Routed
      - Enabled
  maintainer:
    description: Candidate supported, stabilized, or operated production systems.
    verbs:
      - Maintained
      - Monitored
      - Supported
      - Troubleshot
      - Debugged
      - Resolved
      - Stabilized
  deployer:
    description: Candidate worked on build, release, deployment, or environment promotion.
    verbs:
      - Deployed
      - Released
      - Automated
      - Configured
      - Packaged
      - Validated
      - Promoted
  collaborator:
    description: Candidate coordinated across teams while contributing technically.
    verbs:
      - Coordinated
      - Collaborated
      - Partnered
      - Reviewed
      - Documented
      - Mentored
    caution: Pair with technical deliverable or outcome.

