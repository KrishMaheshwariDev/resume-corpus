weak_or_overused_verbs:
  avoid_as_openers:
    - Used
    - Worked
    - Helped
    - Assisted
    - Handled
    - Participated
    - Involved
    - Responsible
  acceptable_when_rewritten:
    Used: Replace with Implemented, Integrated, Developed, Automated, or Optimized.
    Worked: Replace with Developed, Supported, Coordinated, Refactored, or Validated.
    Helped: Replace with Supported or Contributed only if minor; otherwise use actual action.
    Handled: Replace with Managed, Resolved, Monitored, or Coordinated depending on context.

verbs_to_use_carefully:
  Architected:
    allowed_when: Candidate made architecture-level decisions or designed major system structure.
    risk: Sounds inflated if used for normal feature development.
  Led:
    allowed_when: Candidate guided people, project execution, or technical direction.
    risk: Misleading without team or scope evidence.
  Owned:
    allowed_when: Candidate had accountability for a feature, service, release, or operational area.
    risk: Overstates responsibility if only contributed.
  Spearheaded:
    allowed_when: Candidate initiated and drove a major effort.
    risk: Sounds promotional; often less credible than Led or Implemented.

java_backend_examples:
  - weak: "Worked on REST APIs."
    stronger: "Developed Java/Spring Boot REST APIs for healthcare payer integrations."
  - weak: "Used Jenkins for deployment."
    stronger: "Automated Maven builds and Jenkins deployments across DEV/SIT environments."
  - weak: "Handled production issues."
    stronger: "Resolved production API issues by improving Log4j 2.x diagnostics and exception handling."
  - weak: "Participated in database optimization."
    stronger: "Optimized SQL queries and validated Oracle-backed API changes with PL/SQL teams."
  - weak: "Helped with Azure messaging."
    stronger: "Integrated Azure Service Bus Topics with WebSphere JMS queues for hybrid-cloud data exchange."
