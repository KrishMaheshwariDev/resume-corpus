purpose: Project-bullet semantics for Krish Maheshwari's C++/software-engineering intern/fresher resumes.
required_shape: action + implementation detail + technology/context + outcome_or_constraint
evidence_depth:
  P2_project:
    allowed: [built, implemented, designed, benchmarked, analyzed, documented]
    prohibited: [productionized, customer_impact, enterprise_scale, employer_delivery]
  P4_foundational:
    required_qualifiers: [basic, foundational, coursework, learning]
project_rules:
  - Keep OpenChess and Get-My-Doc marked in development.
  - Tie FPS, memory, TPS, file-count, or ranking figures to project/activity context.
  - Do not convert repository structure, planned architecture, or README intentions into completed features.
  - Prefer one dominant technical idea per bullet.

