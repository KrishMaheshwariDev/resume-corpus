version: 2
last_updated: 2026-08-11
purpose: Machine-readable checklist for every resume optimization run.

mandatory: true
non_negotiable_rule: Do not edit resume files directly from memory alone. Reload the profile evidence and knowledge base first.

preflight_required_files:
  - profiles/MASTER_PROFILE_V2.md
  - profiles/PROFILE_FACT_MATRIX_V2.yml
  - profiles/ARCHIVE_RESUME_CORPUS_AUDIT.md
  - profiles/WORK_EXPERIENCE_EVIDENCE_OVERLAY_2026-08-11.md
  - profiles/PROJECT_EVIDENCE_OVERLAY_2026-08-11.md
  - profiles/EVIDENCE_FACT_OVERLAY_2026-08-11.yml
  - profiles/UNRESOLVED_SOURCES.md
  - kb/resume_optimization_knowledge_base.md
  - kb/human_review/resume_perception_knowledge_base.md
  - kb/scoring/weights.yml
  - kb/scoring/human_review_weights.yml
  - kb/skills/java_backend_taxonomy.yml
  - kb/roles/java_backend_engineer.yml
  - kb/writing/bullet_semantics.yml
  - kb/writing/action_verbs_java_backend.yml
  - kb/optimization_run_protocol.md

evidence_precedence:
  - explicit_user_confirmation_current_conversation
  - evidence_overlays_2026_08_11
  - current_repo_resume_source
  - v2_profile_fact_matrix
  - archive_and_exported_sources
  - current_project_repositories
  - older_resume_variants

overlay_rules:
  apply_after_v2_baseline: true
  prefer_overlay_for:
    - implementation_detail
    - architecture
    - ownership
    - skill_depth
    - metric_confidence
  do_not_silently_resolve:
    - HR_title_conflicts
    - employment_date_conflicts
    - contact_conflicts

run_types:
  general_optimization:
    requires_job_description: false
    focus:
      - baseline_java_backend_fit
      - parse_safety
      - evidence_density
      - human_review_clarity
  jd_specific_tailoring:
    requires_job_description: true
    focus:
      - hard_requirement_gate
      - exact_jd_keyword_coverage
      - semantic_responsibility_alignment
      - truthfulness_guard
  one_page_compression:
    requires_job_description: false
    focus:
      - preserve_high_signal_metrics
      - preserve_strongest_ownership_stories
      - remove_low_signal_filler
      - retain_required_keywords
      - maintain_readability
  human_review_pass:
    requires_job_description: false
    focus:
      - first_pass_role_clarity
      - top_half_signal_strength
      - action_language
      - skimmability
  ats_pass:
    requires_job_description: true
    focus:
      - parse_quality
      - exact_keyword_match
      - alias_normalization
      - required_skill_coverage

required_phases:
  - intake
  - mandatory_profile_and_kb_reload
  - parse_and_baseline_review
  - evidence_reconciliation
  - ats_or_role_fit_analysis
  - human_review_analysis
  - truthfulness_gate
  - edit_strategy
  - source_edit
  - post_edit_validation
  - change_summary

evidence_reconciliation:
  must_check:
    - ownership_scope
    - production_vs_project_depth
    - metric_confidence
    - architecture_precision
    - unresolved_source_conflicts
  current_high_value_examples:
    - ntt_log4j2_migration_strong_ownership
    - ntt_monitoring_jar_correlation_ids
    - ntt_memory_incident_supporting_investigator
    - ntt_edifecs_integration_analysis
    - capgemini_vin_latency_60_plus_to_10_20_seconds
    - capgemini_python_prediction_plus_java_deterministic_validation
    - aws_spark_local_mode_runtime_boundary
    - aws_jdbc_exactly_once_not_established

truthfulness_gate:
  reject_if_introduces:
    - invented_technology_experience
    - unsupported_metrics
    - inflated_years_of_experience
    - exaggerated_leadership
    - fake_production_exposure
    - project_only_skill_presented_as_professional_production_experience
    - unsupported_cloud_kafka_kubernetes_claims
    - ownership_of_systems_managed_by_other_teams
    - guessed_legacy_implementation_details
  allowed_labels:
    - production experience
    - project experience
    - academic experience
    - local project experience
    - exposure
    - familiar with
    - currently learning
    - supporting investigator
    - integration contributor
    - proof of concept

post_edit_validation:
  must_verify:
    - no_unsupported_claims_added
    - no_critical_keywords_removed
    - high_signal_metrics_preserved
    - source_dependent_metrics_not_promoted_without_evidence
    - ownership_qualifiers_preserved
    - production_project_skill_depth_preserved
    - standard_section_headings_preserved
    - parse_safe_format_preserved
    - bullets_readable_not_overcompressed
    - target_role_alignment_preserved

required_report_fields:
  - run_type
  - knowledge_base_files_loaded
  - resume_source_path
  - target_role
  - overall_fit
  - ats_fit
  - human_review_fit
  - hard_requirements
  - required_skill_coverage
  - preferred_skill_coverage
  - top_matched_evidence
  - weak_or_missing_areas
  - recommended_edits
  - truthfulness_risks
  - metric_confidence_risks
  - ownership_qualifiers_applied
  - parse_risks
  - files_changed
  - commit_sha

consistency_instruction: >
  Future resume optimization runs must begin by reading the preflight_required_files.
  If chat context is lost, reload this checklist and optimization_run_protocol.md first.
