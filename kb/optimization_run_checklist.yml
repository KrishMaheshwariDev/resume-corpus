version: 6
last_updated: 2026-08-15
purpose: Machine-readable checklist for every resume optimization run.

mandatory: true
non_negotiable_rule: Do not edit resume files directly from memory alone. Reload profile evidence and KB first.

isolation_policy:
  optimization_is_independent: true
  prohibited_inputs:
    - application_outcomes
    - recruiter_response_history
    - rejection_stages
    - outreach_results
    - funnel_or_conversion_metrics
  terminal_boundary: validated_resume_and_optimization_report
  never_trigger_from_optimization:
    - contact_research
    - outreach_drafting
    - message_queueing
    - application_logging
    - external_sending

tailored_file_preflight:
  required_before_tailored_optimization: true
  command: powershell -ExecutionPolicy Bypass -File scripts/archive-tailored-resumes.ps1
  source_root: resumes/tailored
  archive_pattern: resumes/tailored/old/DD-MM.YYYY
  archive_condition: variant_date_before_current_local_date
  preserve_complete_variant_directory: true
  collision_policy: stop_without_overwrite
  undated_directory_policy: skip_and_report

agent_entry:
  root_contract: AGENTS.md
  resume_skill: .agents/skills/resume-optimizer/SKILL.md
  market_refresh_skill: .agents/skills/market-benchmark-refresh/SKILL.md

preflight_required_files:
  - profiles/MASTER_PROFILE_V2.md
  - profiles/PROFILE_FACT_MATRIX_V2.yml
  - profiles/ARCHIVE_RESUME_CORPUS_AUDIT.md
  - profiles/WORK_EXPERIENCE_EVIDENCE_OVERLAY_2026-08-11.md
  - profiles/PROJECT_EVIDENCE_OVERLAY_2026-08-11.md
  - profiles/AI_ASSISTED_ENGINEERING_EVIDENCE_OVERLAY_2026-08-15.md
  - profiles/EVIDENCE_FACT_OVERLAY_2026-08-11.yml
  - profiles/UNRESOLVED_SOURCES.md
  - profiles/RESUME_POSITIONING_V1.yml
  - kb/resume_optimization_knowledge_base.md
  - kb/human_review/resume_perception_knowledge_base.md
  - kb/scoring/weights.yml
  - kb/scoring/human_review_weights.yml
  - kb/skills/java_backend_taxonomy.yml
  - kb/skills/ai_assisted_engineering.yml
  - kb/roles/java_backend_engineer.yml
  - kb/writing/bullet_semantics.yml
  - kb/writing/action_verbs_java_backend.yml
  - kb/resume_output_requirements.yml
  - kb/optimization_run_protocol.md

general_market_extra_files:
  - kb/market/india_java_backend.yml

evidence_precedence:
  - explicit_user_confirmation_current_conversation
  - evidence_overlays_2026_08_11
  - ai_assisted_engineering_overlay_2026_08_15
  - current_repo_resume_source
  - v2_profile_fact_matrix
  - archive_and_exported_sources
  - current_project_repositories
  - older_resume_variants

overlay_rules:
  prefer_overlay_for:
    - implementation_detail
    - architecture
    - ownership
    - skill_depth
    - metric_confidence
  do_not_silently_resolve:
    - HR_title_conflicts
    - employment_date_conflicts
    - contact_conflicts
    - final_GPA_conflicts
    - work_authorization_conflicts

run_types:
  general_optimization:
    requires_job_description: false
    focus:
      - india_java_backend_market_fit
      - parse_safety
      - evidence_density
      - human_review
      - candidate_differentiation

  jd_specific_tailoring:
    requires_job_description: true
    focus:
      - hard_requirement_gate
      - exact_alias_semantic_coverage
      - responsibility_alignment
      - evidence_strength
      - truthfulness_guard

  one_page_compression:
    requires_job_description: false
    focus:
      - preserve_high_value_evidence
      - remove_redundancy_first
      - maintain_readability_floor

  two_page_expansion:
    requires_job_description: false
    focus:
      - add_material_verified_depth_only
      - no_filler
      - keep_strongest_signals_on_page_one

  human_review_pass:
    requires_job_description: false
    focus:
      - first_pass_role_clarity
      - top_half_signal_strength
      - evidence_density
      - skimmability
      - credibility

  ats_ai_pass:
    requires_job_description: false
    focus:
      - parse_quality
      - role_or_JD_coverage
      - semantic_evidence
      - keyword_saturation

required_phases:
  - intake
  - mandatory_preflight
  - baseline_review
  - evidence_reconciliation
  - requirement_or_market_analysis
  - human_review_analysis
  - truthfulness_gate
  - edit_strategy
  - source_edit
  - build_validation
  - rescore_compare
  - change_summary

evidence_reconciliation:
  must_check:
    - ownership_scope
    - production_vs_project_depth
    - metric_confidence
    - architecture_precision
    - unresolved_source_conflicts
    - summary_to_experience_or_project_alignment
    - technical_skills_to_experience_or_project_alignment
    - strongest_downstream_evidence_represented_in_top_half

cross_section_alignment_gate:
  mandatory: true
  map_format: summary_or_skill_claim_to_visible_evidence_to_depth
  summary_rule: every_material_capability_domain_delivery_approach_and_working_style_claim_requires_visible_work_or_project_proof
  skills_rule: every_prominent_technology_or_skill_family_requires_contextual_work_or_project_proof
  semantic_aliases_allowed: true
  professional_claim_destination: work_experience
  project_claim_destination: projects
  p4_exception:
    allowed_when_relevant: true
    required_labels:
      - knowledge
      - exposure
      - training
      - certification
  orphan_resolution:
    - add_concise_verified_context
    - qualify_to_actual_depth
    - omit_from_current_resume_but_preserve_in_corpus
  release_failure_conditions:
    - material_orphaned_summary_claim
    - material_orphaned_unqualified_technology
    - project_skill_presented_as_professional_proof

  high_value_current_rules:
    - no_employment_or_internship_claim_without_evidence
    - all_project_evidence_stays_project_backed
    - openchess_and_get_my_doc_remain_in_development
    - basic_skills_remain_qualified
    - metrics_require_project_context

truthfulness_gate:
  reject_if_introduces:
    - invented_technology_experience
    - unsupported_metrics
    - inflated_years_of_experience
    - exaggerated_leadership
    - fake_production_exposure
    - project_only_skill_as_professional_experience
    - unsupported_cloud_kafka_kubernetes_claims
    - ownership_of_other_teams_systems
    - guessed_legacy_implementation_details
    - unsupported_distributed_system_guarantees

page_policy:
  allowed_pages: [1, 2]
  body_font_pt_min: 11
  margin_in_min: 0.5
  readability_over_compactness: true
  one_page_not_required: true
  second_page_must_add_material_value: true
  no_filler: true

emphasis_policy:
  use_restrained_bold: true
  preferred_targets:
    - role_defining_technologies
    - verified_metrics
    - ownership_signals
    - measurable_outcomes
  avoid:
    - entire_bold_bullets
    - dense_bold_paragraphs
    - bold_keyword_stuffing

pagination_and_spacing_policy:
  natural_page_flow: true
  forbid_large_avoidable_blank_regions: true
  forbid_repeated_page_two_identity_header_unless_requested: true
  prevent_orphaned_section_headings: true
  require_visible_spacing_between:
    - section_heading_and_content
    - employer_or_project_title_and_bullets
    - subtitle_or_metadata_and_body_text

post_edit_validation:
  must_verify:
    - no_unsupported_claims_added
    - no_critical_evidence_regression
    - source_dependent_metrics_not_promoted_without_intentional_basis
    - ownership_qualifiers_preserved
    - production_project_skill_depth_preserved
    - standard_section_headings_preserved
    - parse_safe_layout
    - readable_1_to_2_page_output
    - target_role_alignment_preserved
    - no_material_orphaned_summary_claims
    - no_material_orphaned_unqualified_technologies
    - project_and_professional_evidence_destinations_preserved
    - no_application_or_outreach_side_effects

scoring_report:
  dimensions:
    - parse_safety
    - requirement_or_market_coverage
    - evidence_strength
    - human_review
    - composite_fit
  targets:
    truthfulness: PASS
    parse_safety_min: 95
    human_review_min: 82
    composite_target_if_truthfully_achievable: 80
  rules:
    - critical_requirement_failures_reported_separately
    - score_never_overrides_truthfulness
    - report_maximum_credible_fit_when_target_cannot_be_met

preferred_validation_commands:
  - python scripts/validate_resume.py --tex resume.tex --pdf Resume.pdf
  - python scripts/score_resume.py --resume resume.tex

regression_reference:
  - evals/resume_optimizer_cases.yml

required_report_fields:
  - run_type
  - source_resume
  - target_role_or_JD
  - market
  - files_loaded
  - page_count
  - parse_safety
  - requirement_or_market_coverage
  - evidence_strength
  - human_review
  - composite_fit
  - hard_requirements_or_gaps
  - top_evidence
  - edits_made
  - truthfulness_risks
  - source_confidence_risks
  - ownership_qualifiers
  - claims_excluded
  - validation
  - files_changed
  - commit_sha
