    reason: Current evidence does not support production ownership at the required depth.
  - claim: Professional AWS/Terraform/Docker production ownership
    reason: Current AWS/Terraform/Docker evidence is project-backed.
  - claim: API Gateway authentication ownership
    reason: Authentication at the NTT gateway boundary was owned by another team.
  - claim: Sole production deployment ownership
    reason: NTT production deployment execution was handled by a deployment team; developer scope was readiness, validation, and go/no-go/rollback recommendation.
  - claim: Multi-node Spark execution or exactly-once PostgreSQL delivery
    reason: The AWS project runs local-mode Spark inside ECS and checkpointing does not establish end-to-end exactly-once JDBC writes.
  - claim: Formal correctness or security guarantees for AI-generated code
    reason: CodingHelper uses bounded tests and validation gates, which do not constitute formal guarantees.
  - claim: NTT 20% issue-resolution, AWS 40% runtime, or broad Capgemini 90% performance metrics
    reason: Direct, higher-confidence evidence was preferred over source-dependent percentages.

