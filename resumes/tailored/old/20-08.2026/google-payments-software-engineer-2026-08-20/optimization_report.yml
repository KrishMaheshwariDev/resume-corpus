hard_gaps:
  - Production payments or financial-services product experience is not established.
  - Verified production traffic is 50K+ daily requests, not Google-scale billions of users or transactions.
  - Hardware-level and network-infrastructure debugging ownership is not established.
  - Mobile development evidence is not established.
  - AI, information retrieval, cloud data processing, and frontend breadth are project-backed rather than employer production evidence.

strongest_retained_evidence:
  - Java services supporting 50K+ daily requests at 99.99% SLA availability.
  - Cross-service integration with explicit timeout and partial-failure behavior.
  - Correlation-ID monitoring with latency, success/failure, and request-volume telemetry.
  - Production memory/resource incident investigation across four load-balanced nodes.
  - Security-driven Log4j2 modernization with PoC, code review, reusable guidance, and rollout coordination.
  - VIN API latency reduction from approximately 60+ seconds to 10-20 seconds.
  - CodingHelper retrieval/AI platform, AWS data pipeline, and React/TypeScript portfolio breadth.

edits_made:
  - Repositioned the first quarter around software engineering, Java systems, production scale, and full-lifecycle delivery.
  - Added recruiter-scan anchors for delivery scope, system reasoning, ownership, design/code review, documentation, and mentoring.
  - Prioritized service boundaries, data, networking, security, failure analysis, observability, and measurable performance.
  - Reordered NTT evidence to foreground issue triage, operational impact analysis, reviews, and documentation.
  - Selected projects that demonstrate AI/information retrieval, cloud/data storage, and full-stack UI versatility.
  - Preserved transaction and balance workflows as explicitly training-backed evidence.
  - Maintained a readable two-page layout at 11 pt with natural content flow and no repeated identity header.

claims_intentionally_not_used:
  - claim: Google-scale or billion-user production systems
    reason: Verified professional scale is 50K+ daily requests.
  - claim: Production payments engineering
    reason: Payments-like balance and transaction workflows are limited to training applications.
  - claim: Ownership of load balancers, networking infrastructure, or hardware operations
    reason: Infrastructure ownership belonged to other teams.
  - claim: Production distributed Spark or exactly-once database delivery
    reason: The project uses local-mode Spark on ECS and does not prove end-to-end exactly-once writes.
  - claim: Production AI/NLP systems
    reason: AI and retrieval evidence comes from implemented personal/academic projects.
  - claim: Sole production deployment ownership
    reason: Dedicated deployment teams executed NTT production deployments.

